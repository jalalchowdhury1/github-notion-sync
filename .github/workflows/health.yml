name: Daily health to Notion
on:
  schedule:
    # BACKSTOP only. The primary is One Clock (AWS EventBridge -> gh-dispatcher
    # Lambda -> workflow_dispatch, ~12:37 UTC); the fleet row for this workflow
    # sets expect_event=workflow_dispatch, so a dead primary shows up red even
    # while this cron keeps the stamp alive. 13:07 UTC = 9:07 AM ET, hours after
    # the Mac's 05:00/06:30 fleet_health.py runs push health.json; :07 dodges the
    # contended top-of-hour queue. Also the dead-Mac watchdog: fails
    # (→ Actions email AND a Telegram of its own) at the first check that
    # finds health.json older than STALE_HOURS in notion_health.py.
    - cron: '7 13 * * *'
  workflow_dispatch:
jobs:
  stamp:
    name: Stamp health.json into the Notion repos table
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Update Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          # The watchdog's own alert channel. A dead Mac cannot send the fleet
          # digest, so without these the only warning is a red run + GitHub's
          # failure email — days of silence in practice. Unset secrets render as
          # empty strings and notion_health.py degrades to email-only rather
          # than crashing.
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python notion_health.py
      - name: Rebuild Mac Mini Schedule table
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_SCHEDULE_DB_ID: ${{ secrets.NOTION_SCHEDULE_DB_ID }}
        run: python notion_schedule.py
