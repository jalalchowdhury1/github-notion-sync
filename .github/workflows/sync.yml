name: Sync GitHub repos to Notion

on:
  schedule:
    # 1st of every month at 13:00 UTC = 9am ET (8am during EST)
    - cron: '0 13 1 * *'
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: sync-${{ github.workflow }}
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Run sync
        env:
          GH_PAT: ${{ secrets.GH_PAT }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: python sync.py

      - name: Failure alert to Telegram
        # 2026-10-10 robustness audit. Inline curl, not the shared gh-actions
        # action: this repo is PUBLIC and a private action repo is only shared
        # with private repos (run 35050014094 failed at "Set up job").
        if: failure() || cancelled()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          curl -s -m 20 -X POST "https://api.telegram.org/bot${TELEGRAM_TOKEN}/sendMessage" \
            --data-urlencode chat_id="${TELEGRAM_CHAT_ID}" \
            --data-urlencode text="⚠️ Notion repo sync (GH_PAT expired?) FAILED: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
